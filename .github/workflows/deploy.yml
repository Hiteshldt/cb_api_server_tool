name: Deploy to AWS EC2

# Triggers automatically when you push to the production branch
on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (just to show diff in Actions UI)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show what changed
        run: git diff --name-only HEAD~1 HEAD || true

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}       # EC2 public IP or domain
          username: ec2-user                       # Amazon Linux 2023 default user
          key:      ${{ secrets.EC2_SSH_KEY }}     # contents of your .pem file
          port:     22
          script: |
            cd ~/cb_api_sever_tool
            ./scripts/deploy.sh

      - name: Notify on failure
        if: failure()
        run: echo "Deploy failed — check the Actions log and run 'pm2 logs cb-api-engine' on the server"
