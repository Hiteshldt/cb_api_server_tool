# Nginx reverse-proxy config for Carbelim API Engine
# Amazon Linux 2023:  place at /etc/nginx/conf.d/carbelim.conf
# Ubuntu:             place at /etc/nginx/sites-available/carbelim + symlink
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;          # catch-all — replace with your domain or EC2 public IP

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Proxy everything to the Node app
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade (admin UI uses fetch, not WS,
        # but good practice and future-proof)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  60s;
    }

    # Health check — allow direct access without going through auth
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;         # don't clutter logs with health pings
    }

    # Block direct access to .env, .git etc.
    location ~ /\. {
        deny all;
        return 404;
    }
}

